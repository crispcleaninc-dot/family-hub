name: us-gen
on: { push: { branches: [us-gen] } }
permissions: { contents: write }
jobs:
  img:
    runs-on: ubuntu-latest
    strategy: { fail-fast: false, max-parallel: 2, matrix: { shot: [n01, n04, n06, n09, n10, n14, n15, n17] } }
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q gradio_client && SHOT=${{ matrix.shot }} python3 gen/img.py || true
      - if: always()
        run: |
          git config user.name "ig"; git config user.email "noreply@anthropic.com"
          git checkout -b story-img-${{ matrix.shot }} && git add -f out && git commit -qm "img" && git push -f origin story-img-${{ matrix.shot }}
