name: cc5-gen
on: { push: { branches: [cc5-gen] } }
permissions: { contents: write }
jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q edge-tts && python3 gen/tts2.py || true
      - if: always()
        run: |
          git config user.name "cc5"; git config user.email "noreply@anthropic.com"
          git checkout -b cc5-tts-out && git add -f out && git commit -qm "voices" && git push -f origin cc5-tts-out
  img:
    runs-on: ubuntu-latest
    strategy: { fail-fast: false, max-parallel: 6, matrix: { shot: ["e01", "e02", "e03", "e04", "e05", "e06", "e07", "e08", "e09", "e10", "e11", "v01", "v02", "v03", "v04", "v05", "v06", "v07", "v08", "v09", "v10", "v11", "v12", "n01", "n02", "n03", "n04", "n05", "n06", "n07", "n08", "n09", "t01", "t02", "t03", "t04", "t05", "t06", "t07", "t08", "t09", "t10", "t11"] } }
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q gradio_client && SHOT=${{ matrix.shot }} python3 gen/img2.py || true
      - if: always()
        run: |
          git config user.name "cc5"; git config user.email "noreply@anthropic.com"
          git checkout -b cc5-img-${{ matrix.shot }} && git add -f out && git commit -qm "img" && git push -f origin cc5-img-${{ matrix.shot }}
