name: fnfd2-img2
on: { push: { branches: [fnfd2-img2] } }
permissions: { contents: write }
jobs:
  img:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy: { fail-fast: false, max-parallel: 26, matrix: { s: ["d02_n3,d02_n6,d03_n2,d03_n3,d03_n4","d03_n5,d03_n6,d05_n1,d05_n2,d05_n3","d09_n4,d09_n5,d09_n6,d10_n3,d11_n4","d11_n5,d11_n6,d12_n4,d12_n5,d12_n6","d14_n4,d14_n5,d14_n6"] } }
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q gradio_client && mkdir -p out && SHOTS=${{ matrix.s }} python3 gen/img.py || true
      - if: always()
        run: |
          git config user.name fnfd; git config user.email noreply@anthropic.com
          B=fnfd2-imgb-$(echo ${{ matrix.s }} | cut -d, -f1)
          git checkout --orphan $B && git rm -rq --cached . && git add -f out && git commit -qm o && git push -f origin $B
