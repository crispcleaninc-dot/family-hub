name: cc5-gen
on: { push: { branches: [cc5-gen] } }
permissions: { contents: write }
jobs:
  redo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q edge-tts && python3 gen/redo.py || true
      - if: always()
        run: |
          git config user.name "cc5"; git config user.email "noreply@anthropic.com"
          git checkout -b cc5-redo-out && git add -f out && git commit -qm "redo" && git push -f origin cc5-redo-out
