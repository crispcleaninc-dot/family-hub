name: fnfs-gen
on: { push: { branches: [fnfs-gen] } }
permissions: { contents: write }
jobs:
  f5:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy: { fail-fast: false, max-parallel: 19, matrix: { k: ["k00", "k01", "k02", "k03", "k04", "k05", "k06", "k07", "k08", "k09", "k10", "k11", "k12", "k13"] } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: sudo apt-get install -y -q ffmpeg; printf 'torch==2.4.1\ntorchaudio==2.4.1\n' > c.txt && pip install -q torch==2.4.1 torchaudio==2.4.1 --index-url https://download.pytorch.org/whl/cpu && pip install -q -c c.txt f5-tts
      - run: mkdir -p out; K=${{ matrix.k }} python3 gen/f5.py > out/log_${{ matrix.k }}.txt 2>&1 || true
      - if: always()
        run: |
          git config user.name fnfs; git config user.email noreply@anthropic.com
          git checkout --orphan fnfs-${{ matrix.k }} && git rm -rq --cached . && git add -f out && git commit -qm o && git push -f origin fnfs-${{ matrix.k }}
  chars:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q edge-tts && mkdir -p out && python3 gen/chars.py > out/log_chars.txt 2>&1 || true
      - if: always()
        run: |
          git config user.name fnfs; git config user.email noreply@anthropic.com
          git checkout --orphan fnfs-chars && git rm -rq --cached . && git add -f out && git commit -qm o && git push -f origin fnfs-chars
  img:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy: { fail-fast: false, max-parallel: 14, matrix: { s: ["M1,M2,M3", "E1a,E1b,E1c", "E1d,E1e,E1f", "E1g,E2a,E2b", "E2c,E2d,E2e", "E2f,E3a,E3b", "E3c,E3d,E3e", "E3f,E4a,E4b", "E4c,E4d,E4e", "E4f,E5a,E5b", "E5c,E5d,E5e", "E6a,E6b,E6c", "E6d,E7a,E7b", "E7c,E7d,E7e"] } }
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q gradio_client && mkdir -p out && SHOTS=${{ matrix.s }} python3 gen/img.py || true
      - if: always()
        run: |
          git config user.name fnfs; git config user.email noreply@anthropic.com
          B=fnfs-img-$(echo ${{ matrix.s }} | tr , _)
          git checkout --orphan $B && git rm -rq --cached . && git add -f out && git commit -qm o && git push -f origin $B
