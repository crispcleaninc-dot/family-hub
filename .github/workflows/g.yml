name: v2-gid2
on: { push: { branches: [v2-gid2] } }
permissions: { contents: write }
jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -q edge-tts faster-whisper && python3 gen5/tts.py > tts.txt 2>&1 || true; mkdir -p out; cp tts.txt out/
      - run: |
          git config user.name "v2"; git config user.email "noreply@anthropic.com"
          git checkout --orphan gd2-tts && git rm -rq --cached . && git add -f out && git commit -qm o && git push -f origin gd2-tts
  img:
    runs-on: ubuntu-latest
    strategy: { fail-fast: false, max-parallel: 14, matrix: { g: ["b04","b09","b11"] } }
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q gradio_client; SHOTS=${{ matrix.g }} python3 gen5/img.py || true
      - run: |
          git config user.name "v2"; git config user.email "noreply@anthropic.com"
          git checkout --orphan gd2-img-${{ matrix.g }} && git rm -rq --cached . && git add -f out && git commit -qm o && git push -f origin gd2-img-${{ matrix.g }}
