name: cc6-redo
on: { push: { branches: [cc6-redo] } }
permissions: { contents: write }
jobs:
  redo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q edge-tts && python3 gen/redo.py || true
      - if: always()
        run: |
          git config user.name "cc6"; git config user.email "noreply@anthropic.com"
          git checkout -b cc6-redo-out && git add -f out && git commit -qm "redo" && git push -f origin cc6-redo-out
