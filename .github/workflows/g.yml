name: v2-gen2
on: { push: { branches: [v2-gen2] } }
permissions: { contents: write }
jobs:
  f5:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy: { fail-fast: false, max-parallel: 12, matrix: { k: ["fr0","fr1","fr2","fr3","en0","en1","en2","en3","en9","es9"] } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: sudo apt-get install -y -q ffmpeg; printf 'torch==2.4.1\ntorchaudio==2.4.1\n' > c.txt && pip install -q torch==2.4.1 torchaudio==2.4.1 --index-url https://download.pytorch.org/whl/cpu && pip install -q -c c.txt f5-tts
      - run: mkdir -p out; K=${{ matrix.k }} python3 gen2/f5.py > out/log_${{ matrix.k }}.txt 2>&1 || true
      - if: always()
        run: |
          git config user.name "v2"; git config user.email "noreply@anthropic.com"
          git checkout --orphan v2p-${{ matrix.k }} && git rm -rq --cached . && git add -f out && git commit -qm o && git push -f origin v2p-${{ matrix.k }}
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q edge-tts && python3 gen2/tts.py > tts.txt 2>&1 || true; mkdir -p out; cp tts.txt out/
      - run: |
          git config user.name "v2"; git config user.email "noreply@anthropic.com"
          git checkout --orphan v2p-tts && git rm -rq --cached . && git add -f out && git commit -qm o && git push -f origin v2p-tts
  img:
    runs-on: ubuntu-latest
    strategy: { fail-fast: false, max-parallel: 8, matrix: { g: ["k01,k09,k17,mC,gEs", "k02,k10,gA,mD,mAs", "k03,k11,gB,mE,mBs", "k04,k12,gC,mF,mCs", "k05,k13,gD,gAs,mDs", "k06,k14,gE,gBs,mEs", "k07,k15,mA,gCs,mFs", "k08,k16,mB,gDs"] } }
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q gradio_client; SHOTS=${{ matrix.g }} python3 gen2/img.py || true
      - run: |
          git config user.name "v2"; git config user.email "noreply@anthropic.com"
          B=v2p-img-$(echo ${{ matrix.g }} | cut -d, -f1)
          git checkout --orphan $B && git rm -rq --cached . && git add -f out && git commit -qm o && git push -f origin $B
