name: cc6-redo
on: { push: { branches: [cc6-redo] } }
permissions: { contents: write }
jobs:
  img:
    runs-on: ubuntu-latest
    strategy: { fail-fast: false, max-parallel: 2, matrix: { shot: ["s93","s96"] } }
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q gradio_client && SEEDS=9204 SHOT=${{ matrix.shot }} python3 gen/img2.py || true
      - if: always()
        run: |
          git config user.name "cc6"; git config user.email "noreply@anthropic.com"
          git checkout -b cc6-img3-${{ matrix.shot }} && git add -f out && git commit -qm "img" && git push -f origin cc6-img3-${{ matrix.shot }}
