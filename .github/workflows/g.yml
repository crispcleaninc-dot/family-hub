name: aud-grace
on: { push: { branches: [aud-grace] } }
permissions: { contents: write }
jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q edge-tts && python3 gen/aud_grace.py || true
      - if: always()
        run: |
          git config user.name "aud"; git config user.email "noreply@anthropic.com"
          git checkout -b aud-grace-out && git add -f out && git commit -qm "voices" && git push -f origin aud-grace-out
