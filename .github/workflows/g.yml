name: cc4-gen
on: { push: { branches: [cc4-gen] } }
permissions: { contents: write }
jobs:
  aud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q edge-tts && python3 gen/aud.py || true
      - if: always()
        run: |
          git config user.name "cc4"; git config user.email "noreply@anthropic.com"
          git checkout -b cc4-aud-out && git add -f out && git commit -qm "audition" && git push -f origin cc4-aud-out
