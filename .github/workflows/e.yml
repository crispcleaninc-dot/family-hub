name: v2-ehud
on: { push: { branches: [v2-ehud] } }
permissions: { contents: write }
jobs:
  f5:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy: { fail-fast: false, matrix: { k: ["en0","en1","en2"] } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: sudo apt-get install -y -q ffmpeg; printf 'torch==2.4.1\ntorchaudio==2.4.1\n' > c.txt && pip install -q torch==2.4.1 torchaudio==2.4.1 --index-url https://download.pytorch.org/whl/cpu && pip install -q -c c.txt f5-tts
      - run: mkdir -p out; K=${{ matrix.k }} python3 gen7/f5.py > out/log_${{ matrix.k }}.txt 2>&1 || true
      - if: always()
        run: |
          git config user.name "v2"; git config user.email "noreply@anthropic.com"
          git checkout --orphan eh-${{ matrix.k }} && git rm -rq --cached . && git add -f out && git commit -qm o && git push -f origin eh-${{ matrix.k }}
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -q edge-tts faster-whisper && python3 gen7/tts.py > tts.txt 2>&1 || true; mkdir -p out; cp tts.txt out/
      - run: |
          git config user.name "v2"; git config user.email "noreply@anthropic.com"
          git checkout --orphan eh-tts && git rm -rq --cached . && git add -f out && git commit -qm o && git push -f origin eh-tts
  img:
    runs-on: ubuntu-latest
    strategy: { fail-fast: false, max-parallel: 14, matrix: { g: ["c01","c02","c03","c04","c05","c06","c07","c08","c09","c10","c11","c12","c13","c14"] } }
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q gradio_client; SHOTS=${{ matrix.g }} python3 gen7/img.py || true
      - run: |
          git config user.name "v2"; git config user.email "noreply@anthropic.com"
          git checkout --orphan eh-img-${{ matrix.g }} && git rm -rq --cached . && git add -f out && git commit -qm o && git push -f origin eh-img-${{ matrix.g }}
