name: media-gen
on:
  push:
    branches: [media-gen]
    paths: ['gen/prompts.json', 'gen/run.py', '.github/workflows/media.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: python3 gen/run.py
      - run: |
          git config user.name "media-bot"; git config user.email "media-bot@users.noreply.github.com"
          git add gen/out && git commit -m "generated images" && git push || echo nothing
