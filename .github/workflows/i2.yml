name: table-img2
on: { push: { branches: [table-img2] } }
permissions: { contents: write }
jobs:
  img:
    runs-on: ubuntu-latest
    strategy: { fail-fast: false, max-parallel: 6, matrix: { g: ['s34'] } }
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q gradio_client; SHOTS=${{ matrix.g }} python3 gen/img.py || true
      - run: |
          git config user.name "tb"; git config user.email "noreply@anthropic.com"
          N=$(echo ${{ matrix.g }} | cut -d, -f1)
          git checkout --orphan tb2-img-$N && git rm -rq --cached . && git add -f out && git commit -qm o && git push -f origin tb2-img-$N
