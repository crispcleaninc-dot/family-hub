name: fnf-skitfix
on: { push: { branches: [fnf-skitfix] } }
permissions: { contents: write }
jobs:
  img:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy: { fail-fast: false, max-parallel: 5, matrix: { shot: [ck1_a, ck1_b, ck1_c, ck2_a, ck2_b, ck2_c, ck3_a, ck3_b, ck3_c, ck4_a, ck4_b, ck4_c, ck5_a, ck5_b, ck5_c, ck6_a, ck6_b, ck6_c] } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -q gradio_client
      - run: mkdir -p out; SHOT=${{ matrix.shot }} python3 gen/img2.py || true
      - if: always()
        run: |
          git config user.name "fnf"; git config user.email "noreply@anthropic.com"
          git checkout --orphan fnf-out-sf-${{ matrix.shot }} && git rm -rqf --cached . && git add -f out && git commit -qm o && git push -f origin fnf-out-sf-${{ matrix.shot }}
