name: voice-fix
on: { push: { branches: [voice-fix] } }
permissions: { contents: write }
jobs:
  v:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -q ffmpeg; pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu && pip install -q f5-tts
      - run: mkdir -p out; python3 gen/gen.py > out/run.txt 2>&1 || true
      - if: always()
        run: |
          git config user.name "vf"; git config user.email "noreply@anthropic.com"
          git rm -q --cached gen/ref.wav || true
          git checkout -b voice-fix-out && git add -f out && git commit -qm o && git push -f origin voice-fix-out
