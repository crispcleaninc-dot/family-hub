name: table-asr
on: { push: { branches: [table-asr] } }
permissions: { contents: write }
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -q ffmpeg; mkdir -p out; pip install -q faster-whisper && python3 gen/asr.py > out/run.txt 2>&1 || true
      - if: always()
        run: |
          git config user.name "tb"; git config user.email "noreply@anthropic.com"
          git checkout --orphan table-asr-out && git rm -rq --cached . && git add -f out && git commit -qm t && git push -f origin table-asr-out
