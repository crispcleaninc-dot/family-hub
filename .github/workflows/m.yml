name: v2-mot
on: { push: { branches: [v2-mot] } }
permissions: { contents: write }
jobs:
  i2v:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy: { fail-fast: false, max-parallel: 14, matrix: { g: ["b06"] } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -q gradio_client; SHOTS=${{ matrix.g }} python3 gen6/i2v.py || true
      - if: always()
        run: |
          git config user.name "v2"; git config user.email "noreply@anthropic.com"
          git checkout --orphan mot-${{ matrix.g }} && git rm -rq --cached . && git add -f out && git commit -qm o && git push -f origin mot-${{ matrix.g }}
