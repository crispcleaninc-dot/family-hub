nt greater than these.",'john 11:35':"Jesus wept.",'proverbs 24:16':"For a just man falleth seven times, and riseth up again: but the wicked shall fall into mischief.",'psalm 46:10':"Be still, and know that I am God: I will be exalted among the heathen, I will be exalted in the earth.",'genesis 9:13':"I do set my bow in the cloud, and it shall be for a token of a covenant between me and the earth.",'proverbs 17:22':"A merry heart doeth good like a medicine: but a broken spirit drieth the bones.",'galatians 6:2':"Bear ye one another's burdens, and so fulfil the law of Christ."};
