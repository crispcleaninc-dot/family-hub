<!-- ===== PAYWALL (Nov 16 2026): one free book, $9.99 unlocks all, $1/month keeps access ===== -->
<style>
#pwBack{position:fixed;inset:0;background:rgba(20,16,40,.62);z-index:99990;display:none;align-items:center;justify-content:center;padding:18px}
#pwBack.on{display:flex}
#pwBox{background:#fffaf2;border-radius:22px;max-width:420px;width:100%;padding:22px 20px 18px;box-shadow:0 18px 50px rgba(0,0,0,.35);font-family:Nunito,Fredoka,system-ui,sans-serif;color:#1B2951;text-align:center;max-height:92vh;overflow:auto}
#pwBox h3{font:800 22px Fredoka,Nunito,sans-serif;margin:4px 0 8px}
#pwBox p{margin:8px 0;line-height:1.45;font-size:15px}
#pwBox .pw-cover{width:120px;border-radius:12px;box-shadow:0 6px 16px rgba(0,0,0,.2)}
#pwBox .pw-price{font:800 34px Fredoka,Nunito,sans-serif;color:#6d28d9;margin:6px 0 0}
#pwBox .pw-sub{font-size:14px;color:#6b5d45}
#pwBox button{display:block;width:100%;margin-top:10px;border:0;border-radius:14px;padding:13px;font:800 16px Fredoka,Nunito,sans-serif;cursor:pointer}
#pwBox .pw-go{background:#6d28d9;color:#fff}
#pwBox .pw-alt{background:#fff;color:#1B2951;border:2px solid #e7d7bf}
#pwBox .pw-link{background:none;color:#6d28d9;text-decoration:underline;font-weight:700;padding:6px}
#pwBox input{width:100%;box-sizing:border-box;padding:12px;border-radius:12px;border:2px solid #e7d7bf;font-size:16px;margin-top:8px}
#pwBox .pw-err{color:#b42318;font-size:14px;min-height:18px}
#pwBox ul{text-align:left;font-size:14px;margin:8px 0 4px 18px;padding:0}
.sb-card .pw-lock,.bookcard .pw-lock{position:absolute;top:8px;right:8px;z-index:3;background:rgba(27,41,81,.85);color:#fff;font-weight:800;font-size:12px;padding:4px 8px;border-radius:12px}
.sb-card .pw-free,.bookcard .pw-free{position:absolute;top:8px;right:8px;z-index:3;background:#16a34a;color:#fff;font-weight:800;font-size:12px;padding:4px 8px;border-radius:12px}
.bookcard{position:relative}
#pwAuthor{margin:14px 0;padding:14px;border:2px solid #e7d7bf;border-radius:16px;background:#fff}
#pwAuthor table{width:100%;border-collapse:collapse;font-size:13px}
#pwAuthor td,#pwAuthor th{border-bottom:1px solid #eee;padding:5px;text-align:left}
#pwAuthor input{width:100%;box-sizing:border-box;padding:9px;border-radius:10px;border:1px solid #ccc}
#pwAuthor button{padding:7px 10px;border-radius:10px;border:0;background:#1B2951;color:#fff;font-weight:700;cursor:pointer;margin:2px}
#pwAuthor code{background:#f4f0ff;padding:2px 6px;border-radius:6px;word-break:break-all}
</style>
<div id="pwBack"><div id="pwBox"></div></div>
<script>
window.PAYWALL=(function(){
  var ACC=null, AUTHOR=false, PIN='', CODE='', DEVP='', waiting=[], TITLES={};
  function $(i){ return document.getElementById(i); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function dev(){ if(DEVP) return DEVP; var d=''; try{ d=localStorage.getItem('mihDevice'); if(!d){ d='d'+Date.now().toString(36)+Math.random().toString(36).slice(2,10); localStorage.setItem('mihDevice',d); } }catch(e){ d='nostorage'; } return d; }
  function user(){ return (window.ME&&ME.username&&!ME.guest)?ME.username:''; }
  function localFree(){ try{ return localStorage.getItem('mihFreeBook')||''; }catch(e){ return ''; } }
  function refresh(cb){ google.script.run.withSuccessHandler(function(a){ ACC=a; if(a.freeBook){ try{ localStorage.setItem('mihFreeBook',a.freeBook); }catch(e){} }
      else if(localFree()){ ACC.freeBook=localFree(); }
      decorate(); var w=waiting; waiting=[]; w.forEach(function(f){ f(); }); if(cb)cb(a); })
    .withFailureHandler(function(){ ACC=ACC||{paid:false,freeBook:localFree(),link:'',price:'$9.99',monthly:'$1/month'}; decorate(); var w=waiting; waiting=[]; w.forEach(function(f){ f(); }); })
    .accessStatus(user(),dev()); }
  function open(html){ $('pwBox').innerHTML=html; $('pwBack').classList.add('on'); }
  function close(){ $('pwBack').classList.remove('on'); }
  function title(id){ return TITLES[id]||'this book'; }
  function cover(id){ return /^legacy:/.test(id)?'':'<img class="pw-cover" src="'+(window.STORY_BASE||'https://crispcleaninc-dot.github.io/family-hub/mommy/')+'books/'+esc(id)+'/cover.jpg" onerror="this.remove()">'; }
  function learnTitles(){ document.querySelectorAll('.sb-card').forEach(function(c){ var t=c.querySelector('.t'); if(t)TITLES[c.dataset.sb]=t.textContent; });
    document.querySelectorAll('.bookcard:not(.sb-card)').forEach(function(c){ var m=/openIntro\('([^']+)'/.exec(c.getAttribute('onclick')||''); var t=c.querySelector('.t'); if(m&&t)TITLES['legacy:'+m[1]]=t.textContent; }); }
  function decorate(){ learnTitles(); var paid=AUTHOR||(ACC&&ACC.paid)||(ACC&&!ACC.link), free=ACC&&ACC.freeBook;
    document.querySelectorAll('.sb-card,.bookcard').forEach(function(c){ var id=c.dataset.sb; if(!id){ var m=/openIntro\('([^']+)'/.exec(c.getAttribute('onclick')||''); if(!m)return; id='legacy:'+m[1]; }
      var tag=c.querySelector('.pw-lock,.pw-free'); if(tag)tag.remove(); if(paid||!ACC)return;
      var s=document.createElement('span'); if(free===id){ s.className='pw-free'; s.textContent='⭐ Your free book'; } else if(free){ s.className='pw-lock'; s.textContent='🔒'; } else return;
      c.appendChild(s); });
    var sh=$('shelf'), ban=$('pwBanner'); if(sh&&!ban&&ACC&&!paid){ ban=document.createElement('button'); ban.id='pwBanner'; ban.type='button';
      ban.style.cssText='display:block;width:100%;margin:6px 0 12px;border:0;border-radius:16px;padding:12px;background:linear-gradient(135deg,#6d28d9,#a855f7);color:#fff;font:800 16px Fredoka,Nunito,sans-serif;cursor:pointer';
      ban.onclick=function(){ open(payHtml('')); }; sh.parentNode.insertBefore(ban,sh); }
    if(ban){ if(paid||!ACC) ban.remove(); else ban.textContent=(ACC.freeBook?'🔒 You have 1 free book · ':'📖 Pick 1 free book, or ')+'unlock all books for '+(ACC.price||'$9.99'); } }
  function payHtml(id){ var c=ACC||{}, link=c.link;
    return (id?cover(id):'')+'<h3>Unlock every book 📚</h3>'+
      (c.freeBook?'<p>Your free book is <b>'+esc(title(c.freeBook))+'</b>. To read <b>'+esc(title(id))+'</b> and all the others, unlock the full library.</p>':'<p>Unlock the full Mommy Is Human Too library.</p>')+
      (c.expired?'<p><b>Your year of full access is up.</b> Renew to keep every book open.</p><div class="pw-price">'+esc(c.monthly||'$12/year')+'</div><div class="pw-sub">renews each year · cancel anytime</div>':'<div class="pw-price">'+esc(c.price||'$9.99')+'</div><div class="pw-sub">for your first year, then '+esc(c.monthly||'$12/year')+' to keep access</div>')+
      '<ul><li>All the read-aloud picture books, with new ones added</li><li>Every character in their own voice</li><li>Covenant verses at the end of every book</li><li>Keep reading straight from one book to the next</li></ul>'+
      (c.expired&&c.renew?'<button class="pw-go" onclick="PAYWALL.pay()">Renew with Square · '+esc(c.monthly||'$12/year')+'</button>':link?'<button class="pw-go" onclick="PAYWALL.pay()">Unlock with Square · '+esc(c.price||'$9.99')+'</button>':'<button class="pw-go" disabled style="opacity:.6">Checkout opens soon</button>')+
      '<button class="pw-alt" onclick="PAYWALL.claimForm()">I already paid</button>'+
      '<button class="pw-alt" onclick="PAYWALL.codeForm()">🎟️ I have a reader code</button>'+
      (c.pending?'<p class="pw-sub">We got your unlock request. It will open as soon as your payment is confirmed.</p>':'')+
      '<button class="pw-link" onclick="PAYWALL.close()">Not now</button>'+
      '<p class="pw-sub" style="margin-top:10px">Just want to help? <a href="https://square.link/u/yIoLFO6p" target="_blank" rel="noopener" style="color:#6d28d9;font-weight:700">💛 Send a gift of any amount, even $1</a>. Gifts support new books and translations; they do not unlock the app.</p>'; }
  function ok(id,proceed){
    if(AUTHOR) return true;
    if(!ACC){ waiting.push(function(){ if(ok(id,proceed))proceed(); }); refresh(); return false; }
    if(ACC.paid) return true;
    if(!ACC.link) return true; // the lock turns on only once a Square checkout link is saved
    if(ACC.freeBook===id) return true;
    if(!ACC.freeBook){ learnTitles();
      open(cover(id)+'<h3>Pick your free book</h3><p>Without the full library you can read <b>one</b> book for free. Make <b>'+esc(title(id))+'</b> your free book?</p>'+
        '<p class="pw-sub">You can\'t switch it later. Unlock everything for '+esc(ACC.price||'$9.99')+' (then '+esc(ACC.monthly||'$1/month')+').</p>'+
        '<button class="pw-go" id="pwPick">Yes, make this my free book</button><button class="pw-alt" onclick="PAYWALL.show()">Unlock every book instead</button><button class="pw-alt" onclick="PAYWALL.codeForm()">🎟️ I have a reader code</button><button class="pw-link" onclick="PAYWALL.close()">Let me look at the others</button><div class="pw-err" id="pwErr"></div>');
      $('pwPick').onclick=function(){ this.disabled=true; this.textContent='Saving…';
        google.script.run.withSuccessHandler(function(a){ ACC=a; try{ localStorage.setItem('mihFreeBook',id); }catch(e){} close(); decorate(); proceed(); })
          .withFailureHandler(function(x){ $('pwErr').textContent=String((x&&x.message)||x); refresh(); }).chooseFreeBook(user(),dev(),id); };
      return false; }
    open(payHtml(id)); return false; }
  function pay(){ if(ACC&&(ACC.link||ACC.renew)){ window.open((ACC.expired&&ACC.renew)?ACC.renew:ACC.link,'_blank'); open('<h3>Finish checkout in the new tab</h3><p>When Square says your payment went through, come back here and tap the button below with the email you used at checkout.</p><button class="pw-go" onclick="PAYWALL.claimForm()">I paid, unlock my books</button><button class="pw-link" onclick="PAYWALL.close()">Close</button>'); } }
  function claimForm(){ open('<h3>Unlock your books</h3><p>Type the email you used at Square checkout.</p><input id="pwEmail" type="email" autocomplete="email" placeholder="you@email.com" value="'+esc((ACC&&ACC.email)||'')+'">'+
      '<button class="pw-go" id="pwClaim">Unlock</button><button class="pw-link" onclick="PAYWALL.close()">Cancel</button><div class="pw-err" id="pwErr"></div>');
    $('pwClaim').onclick=function(){ var b=this; b.disabled=true; b.textContent='Checking…';
      google.script.run.withSuccessHandler(function(a){ ACC=a; decorate(); try{ if(a.paid)localStorage.removeItem('mihPaidCode'); }catch(e){}
          if(a.paid){ open('<h3>All unlocked! 🎉</h3><p>Every book is open. Thank you for supporting Mommy Is Human Too.</p><button class="pw-go" onclick="PAYWALL.close()">Start reading</button>'); if(window.GLOW&&GLOW.award)GLOW.award(5,'Library unlocked!','📚'); }
          else open('<h3>Thank you 💛</h3><p>Your unlock request is in. Your books will open as soon as the payment is confirmed. Check back soon.</p><button class="pw-go" onclick="PAYWALL.close()">OK</button>'); })
        .withFailureHandler(function(x){ b.disabled=false; b.textContent='Unlock'; $('pwErr').textContent=String((x&&x.message)||x); })
        .claimPaid(user(),dev(),$('pwEmail').value,CODE||(function(){ try{ return localStorage.getItem('mihPaidCode')||''; }catch(e){ return ''; } })()); }; }
  // reader codes (Nov 19 2026): the author gives a code, the reader types it, the whole series unlocks with no payment
  function codeForm(){ open('<h3>Enter your reader code 🎟️</h3><p>Type the code you were given to unlock every book.</p><input id="pwCode" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="MIH-XXXXXX">'+
      '<button class="pw-go" id="pwRedeem">Unlock my books</button><button class="pw-link" onclick="PAYWALL.close()">Cancel</button><div class="pw-err" id="pwErr"></div>');
    $('pwRedeem').onclick=function(){ var b=this; b.disabled=true; b.textContent='Checking…';
      google.script.run.withSuccessHandler(function(a){ ACC=a; decorate();
          open('<h3>All unlocked! 🎉</h3><p>Every book is open. Enjoy the whole Mommy Is Human Too library.</p><button class="pw-go" onclick="PAYWALL.close()">Start reading</button>'); if(window.GLOW&&GLOW.award)GLOW.award(5,'Library unlocked!','📚'); })
        .withFailureHandler(function(x){ b.disabled=false; b.textContent='Unlock my books'; $('pwErr').textContent=String((x&&x.message)||x); })
        .redeemReaderCode(user(),dev(),$('pwCode').value); }; }
  function renderCodes(list){ var el=$('pwCodes'); if(!el)return; if(!list||!list.length){ el.innerHTML='No codes yet.'; return; }
    el.innerHTML='<table><tr><th>Code</th><th>For</th><th>Used</th><th></th></tr>'+list.map(function(x){ return '<tr><td><code>'+esc(x.code)+'</code></td><td>'+esc(x.forWho)+'</td><td>'+esc(x.used)+' / '+esc(x.max)+(x.status!=='active'?' ('+esc(x.status)+')':'')+'</td><td>'+
      (x.status==='active'?'<button data-c="'+esc(x.code)+'" data-cs="off" style="background:#b42318">Turn off</button>':'<button data-c="'+esc(x.code)+'" data-cs="active">Turn on</button>')+'</td></tr>'; }).join('')+'</table>';
    el.querySelectorAll('button[data-c]').forEach(function(b){ b.onclick=function(){ google.script.run.withSuccessHandler(renderCodes).withFailureHandler(function(x){ alert(String((x&&x.message)||x)); }).setReaderCodeStatus(PIN,b.dataset.c,b.dataset.cs); }; }); }
  // author tools
  function authorPanel(){ var host=document.getElementById('author'); if(!host||!PIN)return; var box=$('pwAuthor');
    if(!box){ box=document.createElement('div'); box.id='pwAuthor'; host.insertBefore(box,host.children[1]||null); }
    box.innerHTML='<b>💳 Payments</b> <span class="pw-sub">loading…</span>';
    google.script.run.withSuccessHandler(function(r){ var redirect='https://crispcleaninc-dot.github.io/family-hub/mommy/?paid='+r.code;
        box.innerHTML='<b>💳 Payments · $9.99 first year, then $12/year</b>'+
        '<p style="margin:8px 0 4px">Square checkout link</p><input id="pwLinkIn" value="'+esc(r.link||'')+'" placeholder="https://square.link/u/…"><button id="pwLinkSave">Save link</button>'+
        '<p style="margin:10px 0 4px">In Square, set "redirect after payment" to this so buyers unlock right away:</p><code>'+esc(redirect)+'</code>'+
        '<p style="margin:10px 0 4px">Readers (newest first). Type <b>lapsed</b> to cut off someone whose $12/year stopped.</p>'+
        '<table><tr><th>Reader</th><th>Email</th><th>Status</th><th></th></tr>'+r.rows.map(function(x){ return '<tr><td>'+esc(x.user||x.key)+'</td><td>'+esc(x.email)+'</td><td>'+esc(x.status||'free')+'</td><td>'+
          '<button data-k="'+esc(x.key)+'" data-s="paid">Paid</button><button data-k="'+esc(x.key)+'" data-s="lapsed" style="background:#b42318">Lapsed</button></td></tr>'; }).join('')+'</table>'+
        '<p><a href="'+esc(r.sheet)+'" target="_blank">Open the Readers sheet (Access tab)</a></p>'+
        '<p style="margin:14px 0 4px"><b>🎟️ Reader codes</b> · unlock the full series with no payment</p>'+
        '<input id="pwCodeFor" placeholder="Who is it for? (e.g. Grace Church, Ms. Smith)"><input id="pwCodeN" type="number" min="1" max="1000" value="1" style="margin-top:6px" title="How many readers can use this code">'+
        '<button id="pwCodeMake">Make a code</button><div id="pwCodes" class="pw-sub">loading codes…</div>';
        $('pwCodeMake').onclick=function(){ google.script.run.withSuccessHandler(function(l){ renderCodes(l); if(window.toast)toast('Code made: '+((l[0]&&l[0].code)||'')); }).withFailureHandler(function(x){ alert(String((x&&x.message)||x)); }).makeReaderCode(PIN,$('pwCodeFor').value,$('pwCodeN').value); };
        google.script.run.withSuccessHandler(renderCodes).withFailureHandler(function(){ var el=$('pwCodes'); if(el)el.textContent='Codes could not load.'; }).listReaderCodes(PIN);
        $('pwLinkSave').onclick=function(){ google.script.run.withSuccessHandler(function(){ if(window.toast)toast('Square link saved'); refresh(); }).withFailureHandler(function(x){ alert(String((x&&x.message)||x)); }).setSquareLink(PIN,$('pwLinkIn').value); };
        box.querySelectorAll('button[data-k]').forEach(function(b){ b.onclick=function(){ google.script.run.withSuccessHandler(function(){ authorPanel(); }).setPayStatus(PIN,b.dataset.k,b.dataset.s); }; }); })
      .withFailureHandler(function(x){ box.innerHTML='<b>💳 Payments</b> '+esc((x&&x.message)||x); }).payRequests(PIN); }
  function init(){
    var pg=window.pinGo; if(pg) window.pinGo=function(){ var el=document.getElementById('pin'); if(el)PIN=el.value; return pg.apply(this,arguments); };
    var oa=window.openAuthor; if(oa) window.openAuthor=function(){ AUTHOR=true; var r=oa.apply(this,arguments); setTimeout(authorPanel,300); decorate(); return r; };
    ['enterShelf','guestEnter'].forEach(function(n){ var f=window[n]; if(f) window[n]=function(){ var r=f.apply(this,arguments); ACC=null; refresh(); return r; }; });
    var lo=window.rLogout; if(lo) window.rLogout=function(){ AUTHOR=false; PIN=''; ACC=null; return lo.apply(this,arguments); };
    var oi=window.openIntro; if(oi) window.openIntro=function(id){ var a=arguments,self=this; if(ok('legacy:'+id,function(){ oi.apply(self,a); })) return oi.apply(self,a); };
    var sh=$('shelf'); if(sh){ try{ new MutationObserver(function(){ setTimeout(decorate,50); }).observe(sh,{childList:true}); }catch(e){} }
    $('pwBack').addEventListener('click',function(e){ if(e.target.id==='pwBack')close(); });
    var started=false; function go(){ if(!started){ started=true; refresh(); } }
    try{ google.script.url.getLocation(function(loc){ var pr=(loc&&loc.parameter)||{}; if(pr.dev)DEVP=String(pr.dev).slice(0,64);
      var p=pr.paid; if(p){ CODE=p; try{ localStorage.setItem('mihPaidCode',p); }catch(e){} setTimeout(claimForm,1500); } go(); }); }catch(e){}
    setTimeout(go,2500); }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init); else setTimeout(init,0);
  return {ok:ok,show:function(){ open(payHtml('')); },close:close,pay:pay,claimForm:claimForm,codeForm:codeForm,refresh:refresh,status:function(){ return ACC; }};
})();
</script>
