<script>
/* ===== GLOW-UP ADD-ON (Nov 2026) ===== */
var GLOW=(function(){
 function $(i){ return document.getElementById(i); }
 var GLIMPSES=['Look for one small wonder today: a rainbow, a smile, the moon.','Find something that made Mommy smile today.','Notice a kind thing someone did for you.','Spot something beautiful outside your window.','Find a sound that makes you happy.','Thank someone who works hard for you.','Look up at the sky. What do you see?'];
 var BADGES=[['first','📖','First book opened',function(s){return s.opened>=1;}],['three','📚','Book Buddy: 3 books',function(s){return s.opened>=3;}],['done','🏁','Finished a whole book',function(s){return s.finished>=1;}],['art','🎨','Picture Maker',function(s){return s.pics>=1;}],['glimpse','🌈','Glimpse Collector: 3 glimpses',function(s){return s.glimpses>=3;}],['streak3','🔥','3 days in a row',function(s){return s.streak>=3;}],['streak7','🌟','7 days in a row',function(s){return s.streak>=7;}],['stars25','⭐','25 stars',function(s){return s.stars>=25;}]];
 function who(){ return (window.ME&&ME.username)?String(ME.username):'Guest'; }
 function key(){ return 'mihGlow:'+who().toLowerCase(); }
 function today(){ var d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
 function load(){ var s=null; try{ s=JSON.parse(localStorage.getItem(key())||'null'); }catch(e){} return s||{stars:0,opened:0,finished:0,pics:0,glimpses:0,streak:0,last:'',books:{},done:{},badges:{},glimpseDay:''}; }
 function save(s){ try{ localStorage.setItem(key(),JSON.stringify(s)); }catch(e){} }
 function level(st){ var lv=1,need=10,left=st; while(left>=need){ left-=need; lv++; need+=5; } return {lv:lv,pct:Math.round(left/need*100),toNext:need-left}; }
 var NAMES=['Little Reader','Page Turner','Story Seeker','Book Buddy','Reading Star','Story Champion','Wonder Finder','Grace Keeper'];
 function visit(){ var s=load(),t=today(); if(s.last!==t){ var y=new Date(); y.setDate(y.getDate()-1); var yk=y.getFullYear()+'-'+(y.getMonth()+1)+'-'+y.getDate(); s.streak=(s.last===yk)?s.streak+1:1; s.last=t; s.stars+=1; save(s); setTimeout(function(){ pop('👋','Welcome back!','+1 ⭐ for visiting today'); },700); } checkBadges(); }
 function award(n,why,icon){ var s=load(); s.stars+=n; save(s); pop(icon||'⭐','+'+n+' star'+(n>1?'s':''),why); confetti(); checkBadges(); hero(); }
 function checkBadges(){ var s=load(),got=null; BADGES.forEach(function(b){ if(!s.badges[b[0]]&&b[3](s)){ s.badges[b[0]]=today(); got=b; } }); if(got){ save(s); setTimeout(function(){ pop(got[1],'New badge!',got[2]); confetti(true); chime(true); },1700); } }
 var popT=null; function pop(big,title,sub){ var p=$('glowPop'); if(!p)return; p.innerHTML='<div class="gp-big">'+big+'</div><b>'+title+'</b><span>'+(sub||'')+'</span>'; p.classList.add('show'); chime(); clearTimeout(popT); popT=setTimeout(function(){ p.classList.remove('show'); },2200); }
 var AC=null; function chime(big){ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); var notes=big?[523,659,784,1047]:[784,1047]; notes.forEach(function(f,i){ var o=AC.createOscillator(),g=AC.createGain(); o.type='triangle'; o.frequency.value=f; g.gain.setValueAtTime(0,AC.currentTime+i*.09); g.gain.linearRampToValueAtTime(.08,AC.currentTime+i*.09+.02); g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+i*.09+.35); o.connect(g); g.connect(AC.destination); o.start(AC.currentTime+i*.09); o.stop(AC.currentTime+i*.09+.4); }); }catch(e){} }
 function confetti(big){ var c=$('glowFx'); if(!c)return; var x=c.getContext('2d'),W=c.width=innerWidth,H=c.height=innerHeight,P=[],cols=['#ffd27a','#ff8a65','#7e57c2','#26a69a','#42a5f5','#ec407a'];
  for(var i=0;i<(big?140:70);i++)P.push({x:W/2,y:H*.3,vx:(Math.random()-.5)*12,vy:-Math.random()*12-3,r:Math.random()*6+4,c:cols[i%6],a:Math.random()*6,s:Math.random()>.5});
  var t0=performance.now(); (function f(now){ var e=(now-t0)/1000; x.clearRect(0,0,W,H); P.forEach(function(p){ p.vy+=.35; p.x+=p.vx; p.y+=p.vy; p.a+=.2; x.save(); x.translate(p.x,p.y); x.rotate(p.a); x.globalAlpha=Math.max(0,1-e/2.2); x.fillStyle=p.c; if(p.s)x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); else { x.beginPath(); x.arc(0,0,p.r/2,0,7); x.fill(); } x.restore(); }); if(e<2.2)requestAnimationFrame(f); else x.clearRect(0,0,W,H); })(t0); }
 function hero(){ var h=$('glowHero'); if(!h)return; var s=load(),L=level(s.stars),nm=who(),guest=!(window.ME&&!ME.guest);
  h.innerHTML='<div class="gh-top"><div class="gh-av">'+(guest?'💛':nm.charAt(0).toUpperCase())+'</div><div><div class="gh-hi">Hi '+(guest?'there':esc(nm))+'!</div><div class="gh-lv">Level '+L.lv+' · '+NAMES[Math.min(L.lv-1,NAMES.length-1)]+' · '+L.toNext+' ⭐ to level '+(L.lv+1)+'</div></div></div>'+
   '<div class="gh-bar"><i style="width:'+L.pct+'%"></i></div>'+
   '<div class="gh-stats"><div><b>'+s.stars+'</b><span>⭐ stars</span></div><div><b>'+s.streak+'</b><span>🔥 days in a row</span></div><div><b>'+Object.keys(s.badges).length+'</b><span>🏅 badges</span></div></div>'+
   (guest?'<div style="font-size:12px;opacity:.85;margin-top:10px;position:relative">Make a free reader card to keep your stars on any device.</div>':''); }
 function glimpse(){ var g=$('glowGlimpse'); if(!g)return; var s=load(),d=new Date(),txt=GLIMPSES[(d.getDate()+d.getMonth()*31)%GLIMPSES.length],done=s.glimpseDay===today();
  g.className=done?'done':''; g.innerHTML='<div class="gg-ic">🌈</div><div class="gg-t"><b>Today’s glimpse</b>'+txt+'</div><button type="button">'+(done?'✓ Found it':'I found one! +1⭐')+'</button>';
  g.querySelector('button').onclick=function(){ var s2=load(); if(s2.glimpseDay===today())return; s2.glimpseDay=today(); s2.glimpses++; save(s2); award(1,'Glimpse collected!','🌈'); glimpse(); }; }
 var TILE=[['openMake()','🎨','Make a picture','Drag the family into a scene'],['openMine()','🖼️','My pictures','Everything you made'],['stOpen1','✨','Picture Studio','Make real pictures with AI'],["CS.open('color')",'🖍️','Coloring book','Tap to fill with color'],["CS.open('move')",'🚶🏾','Make it move','Walk, run, jump & dance'],["CS.open('story')",'🎬','Story makers','Plan a new story'],["CS.open('chat')",'💬','Talk with the family','Chat with Mommy & the kids']];
 function findBtn(sel){ var sh=$('scr-shelf'); if(!sh)return null; if(sel==='stOpen1')return $('stOpen1'); var all=sh.querySelectorAll('button'); for(var i=0;i<all.length;i++){ var oc=all[i].getAttribute('onclick')||''; if(oc.replace(/\s/g,'')===sel.replace(/\s/g,''))return all[i]; } return null; }
 function tiles(){ var sh=$('scr-shelf'); if(!sh)return; var card=sh.querySelector('.card'); if(!card)return;
  if(!$('glowHero')){ var top=document.createElement('div'); top.innerHTML='<div id="glowHero"></div><div id="glowGlimpse"></div><div class="glow-sec">✨ Let’s play</div><div id="glowTiles"></div><div class="glow-sec" id="glowBooksH">📚 Your books <small>tap a book to open it</small></div>'; card.insertBefore(top,card.firstChild); }
  var grid=$('glowTiles'),n=0;
  TILE.forEach(function(t){ var b=findBtn(t[0]); if(!b)return; if(b.parentNode!==grid){ grid.appendChild(b); } b.className='gt-c'+n+(t[0]==='stOpen1'?' gt-wide':''); b.innerHTML='<span class="gt-ic">'+t[1]+'</span>'+t[2]+'<small>'+t[3]+'</small>'; n++; });
  // any other shelf buttons added by add-ons (not utilities) also become tiles
