<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1B2951">
<link rel="icon" href="icon-192.png">
<title>Service Report · Crispus Diagnostics</title>
<style>
/* Printable service report. Navy / gold / cream (Crisp Cares Environmental Services). Letter size when printed. */
:root{--navy:#1B2951;--gold:#C9A961;--blue:#38B6FF;--cream:#FAF7F0;--ink:#1d2433;--muted:#5d6577;--line:#ddd6c6;--ok:#2e8b57;--low:#c0392b;--high:#c76b00}
*{box-sizing:border-box}
body{margin:0;background:#e9e6de;color:var(--ink);font:15px/1.5 Georgia,"Times New Roman",serif}
.bar{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;display:flex;gap:8px;align-items:center;padding:10px 12px;font-family:system-ui,sans-serif}
.bar a,.bar button{background:#ffffff1f;color:#fff;border:1px solid #ffffff40;border-radius:9px;padding:8px 12px;font:600 14px system-ui,sans-serif;text-decoration:none;cursor:pointer}
.bar .sp{flex:1}
.page{max-width:820px;margin:16px auto;background:#fff;padding:34px 40px;box-shadow:0 2px 14px #0002}
.head{text-align:center;border-bottom:3px solid var(--gold);padding-bottom:12px;margin-bottom:16px}
.head .co{font:700 11px/1.2 Arial,sans-serif;letter-spacing:.16em;color:var(--blue)}
.head h1{margin:4px 0 0;font-size:26px;color:var(--navy);letter-spacing:.04em}
.head .sub{font:700 12px Arial,sans-serif;letter-spacing:.14em;color:var(--gold)}
.meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;font:13px Arial,sans-serif;color:var(--muted);margin-bottom:14px}
h2{font:700 13px Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--navy);border-bottom:1px solid var(--line);padding-bottom:4px;margin:22px 0 8px}
.summary{background:var(--cream);border-left:5px solid var(--gold);padding:14px 16px;border-radius:4px}
.summary .big{font-size:19px;font-weight:700;color:var(--navy);margin-bottom:4px}
.stat{display:inline-block;font:700 11px Arial,sans-serif;border-radius:999px;padding:2px 9px;letter-spacing:.04em;white-space:nowrap}
.s-NORM{background:#e3f4ea;color:var(--ok)}.s-LOW{background:#fbe5e2;color:var(--low)}.s-HIGH{background:#fff0dc;color:var(--high)}.s-INFO{background:#eef1f7;color:var(--navy)}
table{width:100%;border-collapse:collapse;font:14px/1.4 Arial,sans-serif}
th,td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
th{background:var(--navy);color:#fff;font-weight:700;font-size:12px;letter-spacing:.04em}
tr:nth-child(even) td{background:var(--cream)}
td.k{width:34%;font-weight:700;color:var(--navy)}
td .ex{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
ul.ck{list-style:none;padding:0;margin:0;font:14px/1.45 Arial,sans-serif}
ul.ck li{padding:5px 0 5px 30px;position:relative;border-bottom:1px dashed var(--line)}
ul.ck li:before{content:"☐";position:absolute;left:4px;top:3px;font-size:17px;color:var(--muted)}
ul.ck li.done:before{content:"☑";color:var(--ok)}
.note{font:14px/1.5 Arial,sans-serif;white-space:pre-wrap;background:var(--cream);padding:10px 12px;border-radius:4px}
.glossary{font:12.5px/1.45 Arial,sans-serif;color:var(--muted)}
.glossary b{color:var(--ink)}
.sign{display:flex;gap:30px;margin-top:30px;font:13px Arial,sans-serif;color:var(--muted)}
.sign div{flex:1;border-top:1px solid #999;padding-top:4px}
.foot{margin-top:24px;text-align:center;font:11px/1.4 Arial,sans-serif;color:var(--muted);border-top:1px solid var(--line);padding-top:8px}
.list a{display:block;padding:10px 12px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none;font-family:Arial,sans-serif}
.list a b{color:var(--navy)}
@media print{body{background:#fff}.bar{display:none}.page{box-shadow:none;margin:0;max-width:none;padding:0}h2{break-after:avoid}table,.summary{break-inside:avoid}@page{size:letter;margin:.6in}}
@media (max-width:600px){.page{padding:20px 16px;margin:0}}
</style>
</head>
<body>
<div class="bar"><a href="./">‹ Back to app</a><a href="report.html">All reports</a><span class="sp"></span><button id="shareBtn" class="hidden">Share</button><button onclick="window.print()">Print / Save PDF</button></div>
<div class="page" id="page"></div>
<script>
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
var R=[]; try{ R=JSON.parse(localStorage.getItem('mfd_reports_v1')||'[]'); }catch(e){}
var id=new URLSearchParams(location.search).get('id');

/* Plain-language meaning of each reading */
var READ={
  'Suct':['Suction pressure (low side)','Pressure of the refrigerant returning to the compressor.'],
  'SLT':['Suction line temperature','Temperature of the larger, cold copper line at the outdoor unit.'],
  'Head':['Head pressure (high side)','Pressure of the hot refrigerant leaving the compressor.'],
  'LLT':['Liquid line temperature','Temperature of the smaller, warm copper line.'],
  'RA':['Return air','Temperature of the room air going into the system.'],
  'SA':['Supply air','Temperature of the air coming out of the vents.'],
  'OA':['Outdoor air','Outside temperature at the outdoor unit.'],
  'Ent':['Air entering the coil','Air temperature going into the cooling coil (box air).'],
  'Exit':['Air leaving the coil','Air temperature coming off the cooling coil.'],
  'Amb':['Air around the condenser','Temperature of the air the condenser is using to cool.'],
  'CHW lvg':['Chilled water leaving','Temperature of the chilled water sent to the building.'],
  'CW lvg':['Condenser water leaving','Temperature of the water leaving the condenser.'],
  'Twr in':['Tower water in','Water temperature entering the cooling tower.'],
  'out':['Tower water out','Water temperature leaving the cooling tower.'],
  'WB':['Outdoor wet bulb','Outdoor air temperature adjusted for humidity.']
};
var RES={
  'SH':['Superheat','How much the refrigerant warms after it finishes boiling in the indoor coil. Shows if the coil is getting the right amount of refrigerant.'],
  'SC':['Subcooling','How much the liquid refrigerant cools in the outdoor coil. Mainly shows whether the refrigerant charge is right.'],
  'TD':['Coil temperature difference (TD)','Difference between the air entering the coil and the coil itself. Shows if air and refrigerant are working together.'],
  'Split':['Condenser split','Difference between the condensing temperature and the outdoor air. Shows how hard the outdoor coil is working.'],
  'ΔT':['Air temperature drop (ΔT)','How much cooler the air from the vents is than the room air going in. About 16–22°F is typical for cooling.'],
  'Evap appr':['Evaporator approach','How close the refrigerant gets to the chilled-water temperature.'],
  'Cond appr':['Condenser approach','How close the refrigerant gets to the condenser-water temperature.'],
  'Range':['Tower range','How much the cooling tower cools the water.'],
  'AMPS':['Electrical load (amps vs. rating)','Current the compressor is drawing compared with its rated load (RLA) on the nameplate. Running over the rating means it is working too hard.'],
  'Twr appr':['Tower approach','How close the tower water gets to outdoor wet bulb.']
};
var STAT={NORM:'Normal',LOW:'Low',HIGH:'High'};
/* Plain-language meaning of each diagnosis */
var DX={
  'Inefficient compressor':'The compressor (the pump that moves refrigerant) is running but not pumping well. Pressures stay too close together, so the system cannot cool properly. This usually means the compressor is worn or failing internally. Before replacing it, the technician confirms it is not a refrigerant-charge or dirty-coil problem.',
  'Low charge / leak':'The system does not have enough refrigerant. Refrigerant does not get used up, so a low charge almost always means there is a leak. Federal EPA rules require finding and fixing the leak, not just adding refrigerant.',
  'Overcharge':'The system has too much refrigerant. Extra refrigerant is recovered into an approved tank (never released into the air) until the readings are back in range.',
  'Dirty / blocked condenser':'The outdoor coil cannot get rid of heat, usually because it is dirty or airflow is blocked. Cleaning the coil and clearing the area around the unit is the usual fix.',
  'Low evaporator airflow / iced coil':'Not enough air is moving across the indoor coil. Common causes are a dirty filter, a dirty coil, blocked vents or a blower problem. The coil can freeze over if this continues.',
  'Restriction after condenser / plugged metering device':'Refrigerant is being blocked on its way to the indoor coil, often at a clogged filter-drier or metering valve. The blocked part is located and replaced.'
};
function parseList(s){ // "Suct 150 psig / SLT 62° / ..." -> [[label,value]]
  return String(s||'').split(' / ').map(function(p){ p=p.trim(); if(!p) return null;
    var m=p.match(/^(.*?)\s+(-?[\d.]+\s*(?:psig|°|V|A)?)$/); if(m) return [m[1],m[2]];
    var v=p.match(/^(-?[\d.]+)\s*(V|A)$/); if(v) return [v[2]==='V'?'Volts':'Amps',p];
    return [p,''];
  }).filter(Boolean);
}
function niceVal(v){ return String(v).replace(/°$/,'°F').replace(/^(-?[\d.]+)\s*°\s*$/,'$1°F'); }

function renderList(){
  document.title='Service Reports · Crispus Diagnostics';
  var h='<div class="head"><div class="co">CRISP CARES ENVIRONMENTAL SERVICES</div><h1>CRISPUS DIAGNOSTICS</h1><div class="sub">SERVICE REPORTS ON THIS DEVICE</div></div>';
  h+= R.length ? '<div class="list">'+R.slice().reverse().map(function(r){ var d=r.d||{}; return '<a href="report.html?id='+encodeURIComponent(r.id)+'"><b>'+esc(d.client||d.companyId||'Service call')+'</b> · '+esc(d.sheet||'')+'<br><small>'+new Date(r.at).toLocaleString()+(d.tech?' · '+esc(d.tech):'')+'</small></a>'; }).join('')+'</div>'
     : '<p style="font-family:Arial">No reports yet. Every reading you save in the app makes a report here.</p>';
  document.getElementById('page').innerHTML=h;
}
function render(r){
  var d=r.d||{}, at=new Date(r.at);
  var results=String(d.results||''), top='', series='';
  var mSeries=results.match(/^SERIES: (.*) \|\| FINAL: (.*)$/); if(mSeries){ series=mSeries[1]; results=mSeries[2]; }
  var parts=results.split(' — '); var resLine=parts[0]||''; var verdict=parts.slice(1).join(' — ');
  if(/Top match:/.test(verdict)) top=verdict.replace(/^.*Top match:\s*/,'').replace(/\s*★\s*$/,'').trim();
  var withinOk=/WITHIN BENCHMARKS|APPROACHES IN RANGE|all .* steps passed/i.test(results);
  var isFurnace=d.module==='fn', isQuick=/^(rfq|acq)$/.test(d.module);
  // results like "SH 9° (NORM)"
  var resItems=(isFurnace||isQuick)?[]:resLine.split(' / ').map(function(p){ var m=p.trim().match(/^(.+?)\s+(-?[\d.]+)°?\s*\((NORM|LOW|HIGH)\)$/); if(m) return {k:m[1],v:m[2]+'°F',s:m[3]}; var e=p.trim(); var el=e.match(/^(?:([\d.]+)V\s+)?([\d.]+)A(?:\s*[⚠✓]\s*(OVER|under) RLA ([\d.]+))?/); if(el){ return {k:'AMPS',v:(el[1]?el[1]+' V · ':'')+el[2]+' A'+(el[4]?' (rated '+el[4]+' A)':''),s:el[3]==='OVER'?'HIGH':(el[3]?'NORM':'INFO')}; } return e?{k:e,v:'',s:'INFO'}:null; }).filter(Boolean);
  var lows=resItems.filter(function(x){return x.s==='LOW'||x.s==='HIGH';});

  // Plain summary
  var sys=String(d.category||d.sheet||'').split(' · ')[0];
  var what, meaning='';
  if(isFurnace){ what=/passed/.test(results)?'The furnace ran through its full start-up sequence with no problems found.':('The furnace stopped during start-up. '+esc(results.replace(/^Failed at /,'It stopped at ')));}
  else if(isQuick){ what='A quick visual and hands-on check was done (no gauges were connected). The checklist below shows what was looked at.'; }
  else if(withinOk){ what='All measurements were within the normal range. No refrigerant or airflow problem was found.'; }
  else if(top){ what='Most likely problem: <b>'+esc(top)+'</b>.'; meaning=DX[top]||''; }
  else { what=esc(verdict||results||'Readings recorded.'); }
  var stage=d.stage||'';

  var h='<div class="head"><div class="co">CRISP CARES ENVIRONMENTAL SERVICES</div><h1>CRISPUS DIAGNOSTICS</h1><div class="sub">HVAC SERVICE REPORT</div></div>';
  h+='<div class="meta"><span>Report '+esc(r.id)+'</span><span>'+at.toLocaleDateString([], {weekday:'long',year:'numeric',month:'long',day:'numeric'})+' · '+at.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})+'</span></div>';
  h+='<div class="summary"><div class="big">'+esc(sys||'Service call')+(stage?' — '+esc(stage):'')+'</div><div>'+what+'</div>'+(meaning?'<p style="margin:8px 0 0">'+esc(meaning)+'</p>':'')+
     (lows.length?'<p style="margin:8px 0 0"><b>Out of range:</b> '+lows.map(function(x){return esc((RES[x.k]||[x.k])[0])+' was '+STAT[x.s].toLowerCase();}).join('; ')+'.</p>':'')+'</div>';

  h+='<h2>Customer &amp; job</h2><table>'+[['Customer',d.client],['Customer / company ID',d.companyId],['Location',d.location],['Email',d.clientEmail],['Equipment tag',d.equipId],['Technician',d.tech],['Repair stage',stage]].filter(function(x){return x[1];}).map(function(x){return '<tr><td class="k">'+x[0]+'</td><td>'+esc(x[1])+'</td></tr>';}).join('')+'</table>';

  var cat=String(d.category||'').split(' · ').slice(1).filter(function(x){return x && x!=='undefined';});
  var np=String(d.nameplate||'').split(' · ').filter(Boolean).map(function(x){var i=x.indexOf(': '); return i>0?[x.slice(0,i),x.slice(i+2)]:[x,''];});
  if(cat.length||np.length){
    h+='<h2>Equipment</h2><table><tr><td class="k">System</td><td>'+esc(sys)+'</td></tr>'+
      (cat.length?'<tr><td class="k">Details</td><td>'+esc(cat.join(' · '))+'</td></tr>':'')+
      np.map(function(x){return '<tr><td class="k">'+esc(x[0])+'</td><td>'+esc(x[1])+'</td></tr>';}).join('')+'</table>';
  }
  if(!isQuick && d.readings){
    var rr=parseList(d.readings);
    h+='<h2>What was measured</h2><table><tr><th>Reading</th><th>Value</th></tr>'+rr.map(function(x){ var k=x[0], dic=READ[k]; if(!dic && /^\d/.test(k)){ return ''; }
      return '<tr><td class="k">'+esc(dic?dic[0]:k)+(dic?'<span class="ex">'+esc(dic[1])+'</span>':'')+'</td><td>'+esc(niceVal(x[1]))+'</td></tr>'; }).join('')+'</table>';
  }
  if(resItems.length){
    h+='<h2>What the readings mean</h2><table><tr><th>Check</th><th>Result</th><th>Status</th></tr>'+resItems.map(function(x){ var dic=RES[x.k];
      return '<tr><td class="k">'+esc(dic?dic[0]:x.k)+(dic?'<span class="ex">'+esc(dic[1])+'</span>':'')+'</td><td>'+esc(x.v)+'</td><td><span class="stat s-'+x.s+'">'+(STAT[x.s]||'Info')+'</span></td></tr>'; }).join('')+'</table>';
  }
  if(isFurnace && d.readings) h+='<h2>Furnace check</h2><div class="note">'+esc(d.readings)+'\n'+esc(results)+'</div>';
  if(series) h+='<h2>Readings over time</h2><div class="note">'+esc(series.split(' | ').join('\n'))+'</div>';
  var ck=String(d.checklist||'').split('\n').filter(function(x){return x.trim();});
  if(ck.length){
    var done=ck.filter(function(x){return /^\[x\]/.test(x);}).length;
    h+='<h2>'+(isQuick?'Inspection checklist':'Repair checklist')+' <span style="font-weight:400;color:var(--muted)">('+done+' of '+ck.length+' done)</span></h2><ul class="ck">'+ck.map(function(x){ var dn=/^\[x\]/.test(x); return '<li class="'+(dn?'done':'')+'">'+esc(x.replace(/^\[[x ]\]\s*/,''))+'</li>'; }).join('')+'</ul>';
  }
  if(d.notes) h+='<h2>Technician notes</h2><div class="note">'+esc(d.notes)+'</div>';
  if(!isQuick && !isFurnace) h+='<h2>About these numbers</h2><p class="glossary"><b>psig</b> = pounds per square inch on the gauge. <b>°F</b> = degrees Fahrenheit. <b>Normal / Low / High</b> compares each check to the expected range for this type of equipment. One reading alone does not decide the repair; the technician looks at all of them together.</p>';
  h+='<div class="sign"><div>Technician'+(d.tech?': '+esc(d.tech):'')+'</div><div>Customer signature</div><div>Date</div></div>';
  h+='<div class="foot">Crisp Cares Environmental Services · Crispus Diagnostics<br>Refrigerant handled under EPA Section 608 rules (no venting; leaks repaired before recharging).</div>';
  document.getElementById('page').innerHTML=h;
  document.title='Service Report '+r.id+' · '+(d.client||'');
  if(navigator.share){ var b=document.getElementById('shareBtn'); b.classList.remove('hidden'); b.onclick=function(){ navigator.share({title:document.title,text:document.getElementById('page').innerText.slice(0,4000)}).catch(function(){}); }; }
}
var r=null; R.forEach(function(x){ if(x.id===id) r=x; });
if(r) render(r); else renderList();
</script>
<style>.hidden{display:none}</style>
</body>
</html>
